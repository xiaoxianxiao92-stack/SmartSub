name: SmartSub Cloud Robot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: smartsub-cloud-robot
  cancel-in-progress: false

jobs:
  cloud-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Scrapling browser engines
        run: scrapling install

      - name: Discover public subscription sources
        timeout-minutes: 12
        env:
          SMARTSUB_DISCOVERY_MAX_REPOS: "40"
          SMARTSUB_DISCOVERY_MAX_PAGES: "80"
        run: python scripts/super_collector.py

      - name: Validate repository configuration
        run: python scripts/self_check.py

      - name: Collect subscription sources
        run: python main.py

      - name: Initial candidate screening
        timeout-minutes: 20
        run: |
          if [ ! -s collected_nodes.txt ] && [ ! -s sub/sub_all_url_check.txt ]; then
            echo "::error::Collector produced no candidate input"
            exit 1
          fi
          rm -f sub/high_quality_nodes.txt
          python node_quality_filter.py
          test -s sub/high_quality_nodes.txt

      - name: Download Mihomo
        run: |
          python scripts/download_mihomo.py --output ./mihomo
          chmod +x ./mihomo
          ./mihomo -v

      - name: Run cloud robot unit tests
        run: python -m unittest discover -s tests -p "test_cloud_robot.py" -v

      - name: Strict app-level admission
        id: admission
        timeout-minutes: 20
        run: |
          python scripts/cloud_robot.py \
            --input sub/high_quality_nodes.txt \
            --state state/cloud_robot_state.json \
            --mihomo ./mihomo \
            --max-candidates 20 \
            --required-days 3 \
            --timeout 10
          ./mihomo -t -f test_nodes.yaml
          ./mihomo -t -f test_nodes_provisional.yaml

      - name: Fail closed when admission did not complete
        if: always() && steps.admission.outcome != 'success'
        run: |
          echo "::warning::Admission did not complete; clearing the formal subscription to prevent stale nodes from remaining published."
          : > test_nodes.txt
          cat > test_nodes.yaml <<'YAML'
          mixed-port: 7890
          allow-lan: false
          mode: rule
          log-level: warning
          proxies: []
          proxy-groups:
            - name: Proxy
              type: select
              proxies: [DIRECT]
          rules:
            - MATCH,DIRECT
          YAML
          : > test_nodes_provisional.txt
          cat > test_nodes_provisional.yaml <<'YAML'
          mixed-port: 7891
          allow-lan: false
          mode: rule
          log-level: warning
          proxies: []
          proxy-groups:
            - name: Proxy
              type: select
              proxies: [DIRECT]
          rules:
            - MATCH,DIRECT
          YAML
          python -c 'import json; from pathlib import Path; Path("cloud_robot_report.json").write_text(json.dumps({"summary":{"candidates_tested":0,"formal":0,"provisional":0,"rejected":0,"status":"admission_incomplete"}}, indent=2)+"\n", encoding="utf-8")'

      - name: Write workflow summary
        if: always()
        run: |
          if [ -f cloud_robot_report.json ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("cloud_robot_report.json").read_text(encoding="utf-8"))
          summary = report["summary"]
          policy = report.get("policy", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# SmartSub Cloud Robot\n\n")
              for key in ("candidates_tested", "formal", "provisional", "rejected"):
                  f.write(f"- {key}: **{summary.get(key, 0)}**\n")
              f.write(f"- Required consecutive passing days: **{policy.get('required_consecutive_days', 'not completed')}**\n")
              f.write("- App probes: ChatGPT / Gemini / Roblox\n")
          PY
          else
            echo "Cloud robot report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit validated outputs and evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/cloud_robot_state.json cloud_robot_report.json test_nodes.txt test_nodes.yaml
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Cloud Robot: refresh validated node pool"
            git push origin HEAD:main
          else
            echo "No changes to publish."
          fi
